<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiTimer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <div class="container">
        <section class="sound">
          <span class="icon" aria-hidden="true">🔊</span>
          <input id="soundRange" type="range" min="0" max="100" value="70" />
        </section>

        <section class="sound-select">
          <label for="soundSelect">Son</label>
          <select id="soundSelect" aria-label="Choisir un son de notification">
            <option value="beep">Beep</option>
            <option value="bell">Bell</option>
            <option value="chime">Chime</option>
          </select>
        </section>

        <section class="timer" aria-live="polite">
          <span class="ghost">88:88</span>
          <span class="time">
            <span id="minutes">15</span>
            <span class="separator">:</span>
            <span id="seconds">00</span>
          </span>
        </section>

        <section class="controls">
          <button id="addMinute" class="add" aria-label="Ajouter une minute">
            + 1 min
          </button>
          <button id="startPause" class="play" aria-label="Démarrer ou mettre en pause">
            ▶
          </button>
        </section>

        <section class="settings">
          <div class="setting-group">
            <label for="defaultMinutes">Minutes</label>
            <input id="defaultMinutes" type="number" min="0" max="180" step="1" />
          </div>
          <div class="setting-group">
            <label for="defaultSeconds">Secondes</label>
            <input id="defaultSeconds" type="number" min="0" max="59" step="1" />
          </div>
          <button id="reset" class="reset" aria-label="Réinitialiser">
            Reset
          </button>
        </section>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
